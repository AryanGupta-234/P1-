[build-system]
requires = ["setuptools>=83.0.0,<100", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aie-windows"
version = "0.1.0"
description = "Windows-first environment observer foundation for AIE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "psutil>=5.9,<8", "typer>=0.12,<1", "rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=5,<7", "ruff>=0.5,<1"]
windows = ["pywinauto>=0.6.8,<1", "pywin32>=306,<400", "pyetwkit==3.2.0"]

[project.scripts]
aie = "aie.cli:app"
aie-browser-host = "aie.browser.native_host:main"

[tool.setuptools.packages.find]
include = ["aie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
