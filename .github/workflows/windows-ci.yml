name: SENTI CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senti-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install SENTI with Windows and dev extras
        run: python -m pip install -e "./senti[dev,windows]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0,<100"
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --local
      - name: Lint
        run: python -m ruff check senti tests --config pyproject.toml
      - name: Validate SENTI imports
        run: python -c "from senti import SentiService; from senti.ollama import OllamaClient; from senti.tools.defaults import build_default_registry; import senti.ui.server"
      - name: Validate Windows-only optional imports
        run: python -c "import pywinauto; from winrt.windows.devices.radios import Radio, RadioKind, RadioState; import win32evtlog"
      - name: Validate console JavaScript
        run: |
          node --check senti/ui/static/app.js
          node --check senti/ui/static/markdown.js
      - name: Run SENTI tests
        run: python -m pytest tests -k senti
      - name: Build and validate the SENTI distribution
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --wheel --outdir dist/senti ./senti
          python -m twine check dist/senti/*.whl dist/senti/*.tar.gz
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: senti-python-${{ matrix.python-version }}
          path: |
            dist/senti/*.whl
            dist/senti/*.tar.gz
          if-no-files-found: error
          retention-days: 7
