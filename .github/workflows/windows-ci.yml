name: Windows CI

on:
  push:
    branches: [main, dev, browser-video-intelligence, "feat/**", "fix/**", "integrate/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install AIE package and test dependencies
        run: python -m pip install -e ".[dev,windows]"
      - name: Install independent APEX package and test dependencies
        run: python -m pip install -e "./apex[dev,windows]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0,<100"
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --local
      - name: Set up .NET SDK for WPF dashboard
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows desktop dashboard
        run: dotnet build desktop/P1Dashboard/P1Dashboard.csproj --configuration Release
      - name: Lint
        run: python -m ruff check . --config pyproject.toml
      - name: Validate independent APEX imports
        run: python -c "from apex import ApexService; from apex.ollama import OllamaClient; from apex.tools.defaults import build_default_registry"
      - name: Validate Windows-only optional imports
        run: python -c "import pywinauto; from winrt.windows.devices.radios import Radio, RadioKind, RadioState; import win32evtlog; from aie.providers.process_resources import WindowsProcessResourceProvider; from aie.browser.native_host import event_from_browser_payload; from aie.providers.uia import WindowsUIATreeProvider; from aie.providers.eventlog import WindowsEventLogProvider; from aie.providers.etw_process import WindowsETWProcessProvider"
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/register-native-host.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/unregister-native-host.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/validate-target-desktop.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Validate browser extension JavaScript
        run: |
          node --check browser_extension/content.js
          node --check browser_extension/service_worker.js
          node --check browser_extension/popup.js
      - name: Run APEX-focused tests
        run: python -m pytest tests -k apex
      - name: Build and validate independent Python distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --wheel
          python -m build --sdist --wheel --outdir dist/apex ./apex
          python -m twine check dist/*.whl dist/*.tar.gz dist/apex/*.whl dist/apex/*.tar.gz
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: windows-python-${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/apex/*.whl
            dist/apex/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Run full repository tests
        run: python -m pytest
