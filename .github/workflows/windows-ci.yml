name: Windows CI

on:
  push:
    branches: [main, dev, browser-video-intelligence, "feat/**", "fix/**", "integrate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,windows]"
      - name: Audit installed Python dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0,<100"
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --local
      - name: Lint
        run: python -m ruff check .
      - name: Validate Windows-only optional imports
        run: python -c "import pywinauto; import win32evtlog; from aie.providers.process_resources import WindowsProcessResourceProvider; from aie.browser.native_host import event_from_browser_payload; from aie.providers.uia import WindowsUIATreeProvider; from aie.providers.eventlog import WindowsEventLogProvider; from aie.providers.etw_process import WindowsETWProcessProvider"
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $scripts = @("scripts/register-native-host.ps1", "scripts/unregister-native-host.ps1", "scripts/validate-target-desktop.ps1", "scripts/start-dashboard.ps1")
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Validate browser extension JavaScript
        run: |
          node --check browser_extension/content.js
          node --check browser_extension/service_worker.js
          node --check browser_extension/popup.js
      - name: Run tests
        run: python -m pytest
      - name: Build and validate Python distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: aie-python-${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
