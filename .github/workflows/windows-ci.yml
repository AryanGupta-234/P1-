name: Windows CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "integrate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,windows]"
      - name: Lint
        run: python -m ruff check .
      - name: Validate Windows-only optional imports
        run: python -c "import pywinauto; import win32evtlog; from aie.providers.process_resources import WindowsProcessResourceProvider; from aie.browser.native_host import event_from_browser_payload; from aie.providers.uia import WindowsUIATreeProvider; from aie.providers.eventlog import WindowsEventLogProvider; from aie.providers.etw_process import WindowsETWProcessProvider"
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/register-native-host.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/unregister-native-host.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Validate browser extension JavaScript
        run: |
          node --check browser_extension/content.js
          node --check browser_extension/service_worker.js
          node --check browser_extension/popup.js
      - name: Run tests
        run: python -m pytest
