name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install AIE and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: AIE unit tests
        run: python -m pytest tests
      - name: SENTINEL unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Join-Path $PWD "SENTINEL")
          python -m pytest SENTINEL/tests -q
      - name: Compile SENTINEL Python sources
        run: python -c "import compileall; assert compileall.compile_dir('SENTINEL', quiet=1, force=True)"
      - name: Validate SENTINEL dashboard JavaScript
        run: node --check SENTINEL/ui/app.js
      - name: Lint AIE
        run: ruff check aie tests
