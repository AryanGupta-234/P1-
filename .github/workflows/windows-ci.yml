name: Windows CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**", "integrate/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,windows-ui]"
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest
